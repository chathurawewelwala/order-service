replicaCount: 2

image:
  repository: asia-south1-docker.pkg.dev/order-service-gke-demo/order-service/order-service
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 300m
    memory: 640Mi
  limits:
    cpu: 900m
    memory: 1280Mi

env:
  SPRING_DATASOURCE_URL: jdbc:postgresql://order-postgres:5432/orders
  SPRING_DATA_REDIS_HOST: order-redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_CACHE_TYPE: redis
  # Kubernetes probe endpoints (do not require DB for liveness)
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_HEALTH_LIVENESSSTATE_ENABLED: "true"
  MANAGEMENT_HEALTH_READINESSSTATE_ENABLED: "true"
  # OAuth2 Resource Server
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "http://34.180.9.126/realms/orders"
  APP_CORS_ALLOWED_ORIGINS: "http://localhost:4200"


# Startup: allow slow JVM + Hibernate to finish (failureThreshold * periodSeconds = 5 min)
startupProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

ingress:
  enabled: true

persistence:
  enabled: false
  dumps:
    size: 2Gi
  logs:
    size: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
