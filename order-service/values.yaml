replicaCount: 2

image:
  repository: order-service          # or your actual image name
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 700m
    memory: 1Gi

env:
  SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/orders
  SPRING_DATASOURCE_USERNAME: orderuser
  SPRING_DATASOURCE_PASSWORD: orderpass
  SPRING_DATA_REDIS_HOST: host.docker.internal
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_CACHE_TYPE: redis

livenessProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 50
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 35
  periodSeconds: 8
  timeoutSeconds: 3
  failureThreshold: 3