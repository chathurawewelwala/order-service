{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "order-service.fullname" . }}
  labels:
    {{- include "order-service.labels" . | nindent 4 }}
  annotations:
    kubernetes.kubernetes.io/ingress.class: "gce"
    kubernetes.kubernetes.io/ingress.allow-http: "true"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "order-service.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
  {{- end }}