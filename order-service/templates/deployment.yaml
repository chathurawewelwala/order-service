apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "order-service.fullname" . }}
  labels:
    {{- include "order-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "order-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "order-service.selectorLabels" . | nindent 8 }}
    spec:
      # Make PVC mounts writable by non-root user (spring)
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      # Ensure mount paths are owned correctly on first start (GCE PD / empty PVC)
      initContainers:
        - name: fix-logs-perms
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /app/logs /app/dumps && chown -R 1000:1000 /app/logs /app/dumps"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: dumps
              mountPath: /app/dumps
            - name: logs
              mountPath: /app/logs
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: order-db-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-db-secret
                  key: POSTGRES_PASSWORD
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          volumeMounts:
            - name: dumps
              mountPath: /app/dumps
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: dumps
          persistentVolumeClaim:
            claimName: {{ include "order-service.fullname" . }}-dumps
        - name: logs
          persistentVolumeClaim:
            claimName: {{ include "order-service.fullname" . }}-logs
